<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">N-ATLAS on Bridge</title>
  <desc id="d">Nigeria's multilingual model, available to every developer through one API, priced in naira.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1260"/>
      <stop offset="1" stop-color="#6334cb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="72" y="118" font-size="22" font-weight="600" fill-opacity="0.75" letter-spacing="3">BRIDGE BY WEKOYA</text>
    <text x="72" y="196" font-size="68" font-weight="800" letter-spacing="-1.5">N-ATLAS on Bridge</text>
    <text x="72" y="248" font-size="28" fill-opacity="0.9">Nigeria's multilingual model, one API away.</text>
    <text x="72" y="290" font-size="22" fill-opacity="0.7">OpenAI-compatible · priced in naira · ready in minutes</text>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600">
    <g transform="translate(860 92)">
      <rect width="300" height="54" rx="27" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="26" y="35" fill="#ffffff">Báwo ni?</text>
      <text x="274" y="35" fill="#ffffff" fill-opacity="0.65" font-size="16" text-anchor="end">Yorùbá</text>
    </g>
    <g transform="translate(900 162)">
      <rect width="300" height="54" rx="27" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="26" y="35" fill="#ffffff">Sannu!</text>
      <text x="274" y="35" fill="#ffffff" fill-opacity="0.65" font-size="16" text-anchor="end">Hausa</text>
    </g>
    <g transform="translate(860 232)">
      <rect width="300" height="54" rx="27" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="26" y="35" fill="#ffffff">Nnọọ!</text>
      <text x="274" y="35" fill="#ffffff" fill-opacity="0.65" font-size="16" text-anchor="end">Igbo</text>
    </g>
    <g transform="translate(900 302)">
      <rect width="300" height="54" rx="27" fill="#ffffff" stroke="#ffffff"/>
      <text x="26" y="35" fill="#2a1260">Hello!</text>
      <text x="274" y="35" fill="#6334cb" font-size="16" text-anchor="end">English</text>
