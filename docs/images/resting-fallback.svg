<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">What happens when N-ATLAS takes a break</title>
  <desc id="d">Your app asks n-atlas. If it is answering, you get the reply. If it is taking a break, Bridge returns model_resting within a second, charges nothing, and lists suggested_models; your app asks one of those instead and the customer still gets an answer.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6334cb"/></marker>
  </defs>
  <rect width="1200" height="330" rx="20" fill="#f6f4fb"/>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(40 125)">
      <rect width="200" height="80" rx="14" fill="#ffffff" stroke="#e4def0" stroke-width="2"/>
      <text x="100" y="36" font-size="16" font-weight="700" fill="#160c2d" text-anchor="middle">Your app asks</text>
      <text x="100" y="60" font-size="14" fill="#665a78" text-anchor="middle">model: "n-atlas"</text>
    </g>
    <g transform="translate(320 115)">
      <path d="M100 0 L200 50 L100 100 L0 50 Z" fill="#2a1260"/>
      <text x="100" y="47" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">N-ATLAS</text>
      <text x="100" y="67" font-size="13" fill="#d9cdf7" text-anchor="middle">answering?</text>
    </g>
    <g transform="translate(640 30)">
      <rect width="230" height="80" rx="14" fill="#ffffff" stroke="#6334cb" stroke-width="2"/>
      <text x="115" y="36" font-size="16" font-weight="700" fill="#160c2d" text-anchor="middle">Reply from N-ATLAS</text>
      <text x="115" y="60" font-size="14" fill="#665a78" text-anchor="middle">charged per token, in ₦</text>
    </g>
    <g transform="translate(640 210)">
      <rect width="230" height="90" rx="14" fill="#ffffff" stroke="#e4def0" stroke-width="2"/>
      <text x="115" y="32" font-size="16" font-weight="700" fill="#160c2d" text-anchor="middle">503 model_resting</text>
      <text x="115" y="55" font-size="13" fill="#665a78" text-anchor="middle">within a second · ₦0 charged</text>
      <text x="115" y="75" font-size="13" fill="#665a78" text-anchor="middle">+ suggested_models</text>
    </g>
    <g transform="translate(940 210)">
      <rect width="220" height="90" rx="14" fill="#ffffff" stroke="#6334cb" stroke-width="2"/>
      <text x="110" y="36" font-size="16" font-weight="700" fill="#160c2d" text-anchor="middle">Ask a suggested model</text>
      <text x="110" y="60" font-size="13" fill="#665a78" text-anchor="middle">the customer still</text>
      <text x="110" y="78" font-size="13" fill="#665a78" text-anchor="middle">gets an answer</text>
    </g>
    <line x1="242" y1="165" x2="316" y2="165" stroke="#6334cb" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M520 165 L580 165 L580 70 L636 70" fill="none" stroke="#6334cb" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M520 165 L580 165 L580 255 L636 255" fill="none" stroke="#6334cb" stroke-width="2.5" marker-end="url(#a)"/>
    <line x1="872" y1="255" x2="936" y2="255" stroke="#6334cb" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="598" y="60" font-size="14" font-weight="600" fill="#2a1260">yes</text>
    <text x="598" y="245" font-size="14" font-weight="600" fill="#2a1260">no</text>
  </g>
</svg>
